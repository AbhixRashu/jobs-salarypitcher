name: agent

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run ingestion agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run agent
      - name: Commit if changed
        run: |
          git config user.name "jobs-agent"
          git config user.email "jobs-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: ingest update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
